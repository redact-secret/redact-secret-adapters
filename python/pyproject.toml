[build-system]
# 1.25 rejects a list `license-files`; 1.26.x builds but omits the license
# expression from the metadata. 1.27 is the first to emit PEP 639 fields.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "redact-secret-adapters"
version = "0.1.0"
description = "Host integrations for Redact Secret: stdlib logging and OpenTelemetry adapters over the deterministic core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = ["redact-secret>=0.1.0b6,<0.2"]

[project.optional-dependencies]
# Floor: opentelemetry-api<1.16 imports pkg_resources, absent from a modern
# venv. CI tests both ends of the range (scripts/install-range-endpoint.py).
otel = ["opentelemetry-sdk>=1.16.0,<2"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/redact-secret/redact-secret-adapters"
Repository = "https://github.com/redact-secret/redact-secret-adapters"
Issues = "https://github.com/redact-secret/redact-secret-adapters/issues"

[tool.hatch.build.targets.wheel]
packages = ["redact_secret_adapters"]

[tool.hatch.build.targets.sdist]
include = ["redact_secret_adapters", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
