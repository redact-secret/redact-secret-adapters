[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "redact-secret-adapters"
version = "0.1.0"
description = "Host integrations for Redact Secret: stdlib logging and OpenTelemetry adapters over the deterministic core."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]
dependencies = ["redact-secret>=0.1.0b6,<0.2"]

[project.optional-dependencies]
# Range evidence: tests/test_otel_host.py passes at every version from
# 1.16.0 (the CI floor) through 1.44.0 (the latest published at range-check
# time). 1.16.0 is the floor opentelemetry-api dropped `pkg_resources` for
# entry-point loading (opentelemetry-api<1.16 imports `pkg_resources`,
# which isn't installed by default in a modern venv); every version at or
# below 1.15.0 that was tried failed to import for that reason, not a
# redaction defect. `<2` matches the ceiling style of the JS peer range
# (`@opentelemetry/sdk-trace-base": "^2.0.0"`): CI resolves and tests
# both ends of the live range on every run, so a new 1.x release is
# covered without a manifest edit.
otel = ["opentelemetry-sdk>=1.16.0,<2"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/redact-secret/redact-secret-adapters"
Repository = "https://github.com/redact-secret/redact-secret-adapters"
Issues = "https://github.com/redact-secret/redact-secret-adapters/issues"

[tool.hatch.build.targets.wheel]
packages = ["redact_secret_adapters"]

[tool.hatch.build.targets.sdist]
include = ["redact_secret_adapters", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
