name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:
  # Dispatched by cut-rc.yml and release-reconcile.yml onto the head of a PR
  # they open: a PR opened with GITHUB_TOKEN fires no `pull_request` event,
  # and required checks match by name on the head commit, whatever the event.
  workflow_dispatch:

permissions: {}

concurrency:
  # `github.workflow` is the caller's name under workflow_call, so the
  # Release workflow's CI never cancels (or is cancelled by) a plain CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        if: matrix.node != '22'
      # One leg measures statement coverage and fails below 80%.
      - run: npm run coverage
        if: matrix.node == '22'

  range-endpoints:
    # A typecheck only covers the versions that are installed, so every
    # declared range — each peerDependency and the core — is exercised at both
    # ends. The tests run too: the real-host tests are what prove a host range.
    name: Range endpoint (${{ matrix.end }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        end: [lowest, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run range-endpoint -- ${{ matrix.end }}
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --require-hashes -r .github/requirements/python-test.txt
          python -m pip install --no-deps --no-build-isolation -e ./python
      - run: pytest
        if: matrix.python != '3.13'
      # One leg measures statement coverage and fails below 80%.
      - run: pytest --cov=redact_secret_adapters --cov-report=term-missing --cov-fail-under=80
        if: matrix.python == '3.13'

  pack-contents:
    # CI's own tests import every package from inside the workspace, which
    # resolves through node_modules symlinks and never touches `exports`,
    # `files`, or `dist`. This asserts the tarball `npm pack` would actually
    # ship is exactly `dist` (mirroring `src`), `CHANGELOG.md`, `README.md`,
    # `LICENSE`, and `package.json` — no test files, no `src`, no `tsconfig*`.
    name: npm pack contents
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify-pack-contents

  npm-install-smoke:
    # Packs every workspace, installs the tarballs into a throwaway project
    # outside the checkout, and imports each package through its public
    # entry point against a real host — the only way to catch a wrong
    # `exports` entry, a missing `types` path, or a `dist` file workspace
    # resolution silently papers over.
    name: npm install smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke-test
      # adapter-otel-logs (#178) is private until released, so its tarball and
      # README example are checked from a clean install at both ends of the
      # sdk-logs range here, outside the checkout.
      - run: npm run smoke-test:otel-logs -- highest
      - run: npm run smoke-test:otel-logs -- lowest

  published-combination:
    # The smoke test pairs every tarball with its siblings' tarballs. A
    # registry consumer can instead get the lowest published sibling each
    # range admits; this installs that pairing and runs each package's
    # contract probe, so a range floor below the sibling version that
    # carries a needed API fails (#36).
    name: Published sibling combination
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run published-combination

  python-wheel-smoke:
    # `pip install -e` (the `python` job above) never builds a wheel. This
    # builds the real sdist and wheel, `twine check`s both, and installs
    # the wheel — not editable, not the source tree — into a fresh
    # virtualenv outside the checkout.
    name: Python wheel smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/python-build.txt
      - run: python scripts/smoke-test-python-wheel.py

  python-range-endpoints:
    # Same rule as `range-endpoints`, for the Python side: every declared
    # range (the `redact-secret` dependency and the `opentelemetry-sdk`
    # range in the `otel` extra) is exercised at both ends, resolved from
    # python/pyproject.toml rather than hardcoded here.
    name: Python range endpoint (${{ matrix.end }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        end: [lowest, highest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --require-hashes -r .github/requirements/python-range.txt
          python -m pip install --no-deps --no-build-isolation -e ./python
      - run: python scripts/install-range-endpoint.py ${{ matrix.end }}
      - run: pytest

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compat:check
      # The adapter release feed redact-secret-www reads (#61): fails when the
      # committed site-feed/v1/adapters.json is not what the manifests and
      # compatibility.json generate, or does not match its schema.
      - run: npm run feed:check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/python-lint.txt
      - run: ruff check python
      - run: ruff format --check python
      - run: ruff check --config python/pyproject.toml scripts/install-range-endpoint.py scripts/smoke-test-python-wheel.py scripts/measure-overhead.py scripts/overhead_workloads.py scripts/install-overhead-baseline.py
      - run: ruff format --check --config python/pyproject.toml scripts/install-range-endpoint.py scripts/smoke-test-python-wheel.py scripts/measure-overhead.py scripts/overhead_workloads.py scripts/install-overhead-baseline.py

  overhead-harness:
    # The adapter-overhead harnesses (#11) and the footprint harness (package
    # size and initialization time, #12) in --quick mode: proves they still
    # run against the current packages and emit the overhead-v2 shape
    # redact-secret-benchmarks reads. The numbers from this job are
    # meaningless (three tiny repetitions on a shared runner) and are not
    # kept; measurement and judgement belong to redact-secret-benchmarks.
    name: Overhead harness smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run build
      - run: node scripts/measure-overhead.mjs --quick --out overhead-js.json
      - run: node scripts/install-overhead-baseline.mjs "$RUNNER_TEMP/overhead-baseline"
      - run: node scripts/measure-overhead.mjs --quick --profile log-flat,mask-payload --baseline "$RUNNER_TEMP/overhead-baseline" --out overhead-baseline-js.json
      - run: node scripts/measure-footprint.mjs --quick --out footprint-js.json
      - run: |
          python -m pip install --require-hashes -r .github/requirements/python-otel.txt
          python -m pip install --no-deps --no-build-isolation -e ./python
      - run: python scripts/measure-overhead.py --quick --out overhead-python.json
      - run: python scripts/install-overhead-baseline.py "$RUNNER_TEMP/overhead-baseline-python"
      - run: python scripts/measure-overhead.py --quick --profile log-flat,mask-payload --baseline "$RUNNER_TEMP/overhead-baseline-python" --out overhead-baseline-python.json
      - name: Check the outputs carry the overhead-v2 and footprint-v1 shapes
        run: |
          node -e '
            for (const file of ["overhead-js.json", "overhead-python.json"]) {
              const out = JSON.parse(require("fs").readFileSync(file, "utf-8"));
              if (out.schema !== "redact-secret-adapters/overhead-v2" || out.results.length === 0) throw new Error(file);
              for (const r of out.results) for (const m of ["host", "adapter-identity", "adapter-core", "core-direct"]) {
                const mode = r.modes[m];
                if (!(mode.samples.length > 0)) throw new Error(`${file}: ${r.host}/${r.profileId} ${m}`);
                if (!(mode.latency.count > 0 && mode.latency.p99 >= mode.latency.median)) throw new Error(`${file}: ${r.host}/${r.profileId} ${m} latency`);
                if (!(mode.memory.gcCountPerEvent >= 0)) throw new Error(`${file}: ${r.host}/${r.profileId} ${m} memory`);
              }
            }
            for (const file of ["overhead-baseline-js.json", "overhead-baseline-python.json"]) {
              const compared = JSON.parse(require("fs").readFileSync(file, "utf-8"));
              if (compared.baseline === null || compared.results.length === 0) throw new Error(file);
              for (const r of compared.results) {
                if (r.baseline === undefined) throw new Error(`${file}: ${r.host}/${r.profileId} baseline`);
                if (r.baseline.comparable && !(r.change.traversal.baseline !== undefined)) throw new Error(`${file}: ${r.host}/${r.profileId} change`);
              }
            }
            const footprint = JSON.parse(require("fs").readFileSync("footprint-js.json", "utf-8"));
            if (footprint.schema !== "redact-secret-adapters/footprint-v1" || footprint.results.length === 0) throw new Error("footprint-js.json");
            for (const r of footprint.results) {
              if (!(r.packageSize.tarballBytes > 0)) throw new Error(`footprint-js.json: ${r.package} packageSize`);
              for (const m of ["import", "core", "live-factory"]) {
                if (!(r.initialization[m].samples.length > 0)) throw new Error(`footprint-js.json: ${r.package} ${m}`);
              }
            }'

  bench-image:
    # docker/bench.Dockerfile builds and runs the harness against the
    # published previous release (#97), in --quick mode on two profiles:
    # proves the image still works. Its numbers are meaningless and not kept.
    name: Bench image smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/bench-docker.mjs --quick --out out/overhead-js.json -- --profile log-flat,mask-payload
      - run: node scripts/bench-docker.mjs --python --quick --out out/overhead-python.json -- --profile log-flat,mask-payload
      - name: Check the outputs came from the images and carry the baseline
        run: |
          node -e '
            for (const file of ["out/overhead-js.json", "out/overhead-python.json"]) {
              const out = JSON.parse(require("fs").readFileSync(file, "utf-8"));
              if (out.schema !== "redact-secret-adapters/overhead-v2") throw new Error(`${file}: schema`);
              if (!/^sha256:/.test(out.environment.containerImage ?? "")) throw new Error(`${file}: containerImage`);
              if (out.source.commit === null) throw new Error(`${file}: source.commit`);
              // #108: a container cannot see the host CPU; without the host model every machine shares one profile id.
              const env = out.environment;
              if (!env.cpuModel || /^unknown/i.test(env.cpuModel)) throw new Error(`${file}: cpuModel is ${env.cpuModel}`);
              if (env.cpuModelSource !== "host-env") throw new Error(`${file}: cpuModelSource is ${env.cpuModelSource}`);
              if (env.arch !== "arm64" && env.arch !== "x64") throw new Error(`${file}: arch is not normalized: ${env.arch}`);
              if (out.baseline === null || !out.results.every((r) => r.baseline !== undefined)) throw new Error(`${file}: baseline`);
            }'

  ci-passed:
    # The single required status check for develop, release and main, so
    # branch rulesets don't have to list (and track renames of) every
    # matrix leg above.
    name: CI passed
    if: always()
    needs:
      - node
      - range-endpoints
      - python
      - pack-contents
      - npm-install-smoke
      - published-combination
      - python-wheel-smoke
      - python-range-endpoints
      - lint
      - overhead-harness
      - bench-image
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless every CI job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job finished with '$result'"
              exit 1
            fi
          done
