name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and build, but publish nothing and tag nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  preflight:
    # Reads the versions the manifests declare (never computed or bumped here)
    # and refuses to continue if any of them is already on its registry. This
    # is a hard stop before anything is built for publish, not an overwrite
    # attempt.
    name: Preflight
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      adapter_version: ${{ steps.versions.outputs.adapter_version }}
      adapter_pino_version: ${{ steps.versions.outputs.adapter_pino_version }}
      adapter_otel_version: ${{ steps.versions.outputs.adapter_otel_version }}
      python_version: ${{ steps.versions.outputs.python_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Read declared versions
        id: versions
        run: |
          set -euo pipefail
          adapter=$(node -p "require('./packages/adapter/package.json').version")
          pino=$(node -p "require('./packages/adapter-pino/package.json').version")
          otel=$(node -p "require('./packages/adapter-otel/package.json').version")
          python=$(grep -m1 '^version = ' python/pyproject.toml | sed -E 's/version = "(.*)"/\1/')

          {
            echo "adapter_version=$adapter"
            echo "adapter_pino_version=$pino"
            echo "adapter_otel_version=$otel"
            echo "python_version=$python"
          } >> "$GITHUB_OUTPUT"

          echo "Declared versions for this release:"
          echo "  @redact-secret/adapter@$adapter"
          echo "  @redact-secret/adapter-pino@$pino"
          echo "  @redact-secret/adapter-otel@$otel"
          echo "  redact-secret-adapters@$python (PyPI)"

      - name: Refuse to publish an already-published version
        run: |
          set -euo pipefail
          exists=0

          check_npm() {
            local name="$1" version="$2"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::error::${name}@${version} is already published to npm"
              exists=1
            fi
          }

          check_pypi() {
            local name="$1" version="$2"
            local http_status
            http_status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/${name}/${version}/json")
            if [ "$http_status" = "200" ]; then
              echo "::error::${name}==${version} is already published to PyPI"
              exists=1
            fi
          }

          check_npm "@redact-secret/adapter" "${{ steps.versions.outputs.adapter_version }}"
          check_npm "@redact-secret/adapter-pino" "${{ steps.versions.outputs.adapter_pino_version }}"
          check_npm "@redact-secret/adapter-otel" "${{ steps.versions.outputs.adapter_otel_version }}"
          check_pypi "redact-secret-adapters" "${{ steps.versions.outputs.python_version }}"

          if [ "$exists" -ne 0 ]; then
            echo "::error::One or more declared versions already exist on a registry. Bump the manifest version before releasing."
            exit 1
          fi

  publish-adapter:
    # Publishes first: adapter-pino and adapter-otel both depend on this at
    # ^0.1.0, and only resolve once it exists on the registry.
    name: Publish @redact-secret/adapter
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace @redact-secret/adapter

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --workspace @redact-secret/adapter --access public --dry-run
          else
            npm publish --workspace @redact-secret/adapter --access public --provenance
          fi

  publish-adapter-pino:
    name: Publish @redact-secret/adapter-pino
    needs: publish-adapter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace @redact-secret/adapter-pino

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --workspace @redact-secret/adapter-pino --access public --dry-run
          else
            npm publish --workspace @redact-secret/adapter-pino --access public --provenance
          fi

  publish-adapter-otel:
    name: Publish @redact-secret/adapter-otel
    needs: publish-adapter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace @redact-secret/adapter-otel

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Publish
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --workspace @redact-secret/adapter-otel --access public --dry-run
          else
            npm publish --workspace @redact-secret/adapter-otel --access public --provenance
          fi

  publish-python:
    # Independently versioned from the npm side, but the issue's stated order
    # is adapter -> (adapter-pino, adapter-otel) -> PyPI, so this waits on
    # both host packages rather than running in parallel with them.
    name: Publish redact-secret-adapters (PyPI)
    needs: [publish-adapter-pino, publish-adapter-otel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build ./python
      - run: twine check python/dist/*

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist

  finalize:
    # Tags per package, only for what this run actually published, only
    # after publishing succeeded -- never before, never for a dry run. Then
    # reports what was attempted against what the registries now report,
    # since a partial run across two registries is not transactional and
    # must be diagnosable rather than silent.
    name: Tag and report
    needs:
      - preflight
      - publish-adapter
      - publish-adapter-pino
      - publish-adapter-otel
      - publish-python
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Tag published packages
        if: ${{ !inputs.dry_run }}
        env:
          ADAPTER_RESULT: ${{ needs.publish-adapter.result }}
          PINO_RESULT: ${{ needs.publish-adapter-pino.result }}
          OTEL_RESULT: ${{ needs.publish-adapter-otel.result }}
          PYTHON_RESULT: ${{ needs.publish-python.result }}
          ADAPTER_VERSION: ${{ needs.preflight.outputs.adapter_version }}
          PINO_VERSION: ${{ needs.preflight.outputs.adapter_pino_version }}
          OTEL_VERSION: ${{ needs.preflight.outputs.adapter_otel_version }}
          PYTHON_VERSION: ${{ needs.preflight.outputs.python_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tag_if_published() {
            local result="$1" tag="$2"
            if [ "$result" = "success" ]; then
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "::warning::Tag $tag already exists on origin, skipping"
                return
              fi
              git tag -a "$tag" -m "Release $tag"
              git push origin "$tag"
            fi
          }

          tag_if_published "$ADAPTER_RESULT" "adapter@${ADAPTER_VERSION}"
          tag_if_published "$PINO_RESULT" "adapter-pino@${PINO_VERSION}"
          tag_if_published "$OTEL_RESULT" "adapter-otel@${OTEL_VERSION}"
          tag_if_published "$PYTHON_RESULT" "redact-secret-adapters@${PYTHON_VERSION}"

      - name: Report
        env:
          ADAPTER_RESULT: ${{ needs.publish-adapter.result }}
          PINO_RESULT: ${{ needs.publish-adapter-pino.result }}
          OTEL_RESULT: ${{ needs.publish-adapter-otel.result }}
          PYTHON_RESULT: ${{ needs.publish-python.result }}
          ADAPTER_VERSION: ${{ needs.preflight.outputs.adapter_version }}
          PINO_VERSION: ${{ needs.preflight.outputs.adapter_pino_version }}
          OTEL_VERSION: ${{ needs.preflight.outputs.adapter_otel_version }}
          PYTHON_VERSION: ${{ needs.preflight.outputs.python_version }}
        run: |
          set -euo pipefail

          npm_registry_version() {
            npm view "$1" version 2>/dev/null || echo "(not on registry)"
          }

          pypi_registry_version() {
            local http_status
            http_status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$1/$2/json")
            if [ "$http_status" = "200" ]; then
              echo "$2"
            else
              echo "(not on registry)"
            fi
          }

          {
            echo "## Release report"
            echo
            echo "| Package | Declared version | Attempted | Result | Registry now reports |"
            echo "|---|---|---|---|---|"
            echo "| @redact-secret/adapter | ${ADAPTER_VERSION} | $([ "$ADAPTER_RESULT" != "skipped" ] && echo yes || echo no) | ${ADAPTER_RESULT} | $(npm_registry_version "@redact-secret/adapter") |"
            echo "| @redact-secret/adapter-pino | ${PINO_VERSION} | $([ "$PINO_RESULT" != "skipped" ] && echo yes || echo no) | ${PINO_RESULT} | $(npm_registry_version "@redact-secret/adapter-pino") |"
            echo "| @redact-secret/adapter-otel | ${OTEL_VERSION} | $([ "$OTEL_RESULT" != "skipped" ] && echo yes || echo no) | ${OTEL_RESULT} | $(npm_registry_version "@redact-secret/adapter-otel") |"
            echo "| redact-secret-adapters (PyPI) | ${PYTHON_VERSION} | $([ "$PYTHON_RESULT" != "skipped" ] && echo yes || echo no) | ${PYTHON_RESULT} | $(pypi_registry_version "redact-secret-adapters" "${PYTHON_VERSION}") |"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "_Dry run: every check and build ran, nothing was published or tagged._"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if any publish job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::One or more publish jobs failed. See the release report above for exactly what shipped."
          exit 1
