name: Release

# Runs when a release train (rc/<train>) is merged into release:
#
#   CI ─▶ rehearsal ─▶ publish (per package) ─▶ tag + GitHub Release ─▶ reconcile
#
# Every package carries its own SemVer. The rehearsal's plan
# (scripts/release-plan.mjs) reads the versions the manifests declare —
# never computed or bumped here — and a package is published exactly when
# its declared version is not on its registry yet. That makes a re-run safe:
# after a partial failure, dispatching this workflow on release publishes
# only what is still missing, never overwrites.
#
# The publish jobs stay in this file: npm and PyPI trusted publishing are
# bound to the calling workflow's filename (release.yml).

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run CI and the rehearsal only: publish nothing, tag nothing"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  rehearsal:
    name: Rehearsal
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/release-rehearsal.yml

  publish-adapter:
    # Publishes first when it is in the plan: adapter-pino and adapter-otel
    # both depend on it and only resolve once it exists on the registry.
    name: Publish @redact-secret/adapter
    needs: rehearsal
    if: >-
      !inputs.dry_run && github.ref == 'refs/heads/release' &&
      needs.rehearsal.outputs.publish_adapter == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace @redact-secret/adapter

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm publish --workspace @redact-secret/adapter --access public --provenance

  publish-adapter-pino:
    # A skipped adapter publish (not in this train) doesn't block this one;
    # a failed one does.
    name: Publish @redact-secret/adapter-pino
    needs: [rehearsal, publish-adapter]
    if: >-
      !cancelled() && !inputs.dry_run && github.ref == 'refs/heads/release' &&
      needs.rehearsal.result == 'success' && needs.publish-adapter.result != 'failure' &&
      needs.rehearsal.outputs.publish_adapter_pino == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace @redact-secret/adapter-pino

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm publish --workspace @redact-secret/adapter-pino --access public --provenance

  publish-adapter-otel:
    name: Publish @redact-secret/adapter-otel
    needs: [rehearsal, publish-adapter]
    if: >-
      !cancelled() && !inputs.dry_run && github.ref == 'refs/heads/release' &&
      needs.rehearsal.result == 'success' && needs.publish-adapter.result != 'failure' &&
      needs.rehearsal.outputs.publish_adapter_otel == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build --workspace @redact-secret/adapter-otel

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: npm publish --workspace @redact-secret/adapter-otel --access public --provenance

  publish-python:
    # Independently versioned from the npm side, but ordered after it: a
    # train whose npm side failed stops before it reaches a second registry.
    name: Publish redact-secret-adapters (PyPI)
    needs: [rehearsal, publish-adapter, publish-adapter-pino, publish-adapter-otel]
    if: >-
      !cancelled() && !inputs.dry_run && github.ref == 'refs/heads/release' &&
      needs.rehearsal.result == 'success' &&
      needs.publish-adapter.result != 'failure' &&
      needs.publish-adapter-pino.result != 'failure' &&
      needs.publish-adapter-otel.result != 'failure' &&
      needs.rehearsal.outputs.publish_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build ./python
      - run: twine check python/dist/*

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist

  finalize:
    # Tags per package, only for what this run actually published, only
    # after publishing succeeded. Then tags the train and creates (or, on a
    # re-run, refreshes) its GitHub Release, and reports what was attempted
    # against what the registries now report, since a partial run across two
    # registries is not transactional and must be diagnosable, not silent.
    name: Tag and report
    needs:
      - rehearsal
      - publish-adapter
      - publish-adapter-pino
      - publish-adapter-otel
      - publish-python
    if: >-
      always() && !inputs.dry_run && github.ref == 'refs/heads/release' &&
      needs.rehearsal.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      train: ${{ steps.train.outputs.train }}
    env:
      ADAPTER_RESULT: ${{ needs.publish-adapter.result }}
      PINO_RESULT: ${{ needs.publish-adapter-pino.result }}
      OTEL_RESULT: ${{ needs.publish-adapter-otel.result }}
      PYTHON_RESULT: ${{ needs.publish-python.result }}
      ADAPTER_VERSION: ${{ needs.rehearsal.outputs.adapter_version }}
      PINO_VERSION: ${{ needs.rehearsal.outputs.adapter_pino_version }}
      OTEL_VERSION: ${{ needs.rehearsal.outputs.adapter_otel_version }}
      PYTHON_VERSION: ${{ needs.rehearsal.outputs.python_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve the train
        # From the rc/<train> PR this commit merged; the merge commit's
        # subject is the fallback if the API has no association for it.
        id: train
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "release" and .merged_at != null) | .head.ref][0] // ""')
          if [ -z "$head" ]; then
            head=$(git log -1 --format=%s | sed -nE 's#^Merge pull request \#[0-9]+ from [^/]+/(rc/[^ ]+)$#\1#p')
          fi
          if ! [[ "$head" =~ ^rc/([0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?)$ ]]; then
            echo "::error::Could not resolve the release train for $GITHUB_SHA (got '$head'). release only moves by merging an rc/<train> PR."
            exit 1
          fi
          echo "train=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Train: ${BASH_REMATCH[1]}"

      - name: Tag published packages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tag_if_published() {
            local result="$1" tag="$2"
            if [ "$result" = "success" ]; then
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                echo "::warning::Tag $tag already exists on origin, skipping"
                return
              fi
              git tag -a "$tag" -m "Release $tag"
              git push origin "$tag"
            fi
          }

          tag_if_published "$ADAPTER_RESULT" "adapter@${ADAPTER_VERSION}"
          tag_if_published "$PINO_RESULT" "adapter-pino@${PINO_VERSION}"
          tag_if_published "$OTEL_RESULT" "adapter-otel@${OTEL_VERSION}"
          tag_if_published "$PYTHON_RESULT" "redact-secret-adapters@${PYTHON_VERSION}"

      - name: Tag the train and publish its GitHub Release
        # Only once at least one package tag points at this commit. The
        # notes are regenerated from those tags, so a re-run that publishes
        # the rest of a partially failed train updates them in place.
        env:
          GH_TOKEN: ${{ github.token }}
          TRAIN: ${{ steps.train.outputs.train }}
        run: |
          set -euo pipefail
          if [ -z "$(git tag --points-at HEAD | grep '@' || true)" ]; then
            echo "::warning::No package was published from this commit; not tagging train/$TRAIN"
            exit 0
          fi
          tag="train/$TRAIN"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git tag -a "$tag" -m "Release train $TRAIN"
            git push origin "$tag"
          fi
          node scripts/release-notes.mjs "$TRAIN" > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --verify-tag --latest --title "Release train $TRAIN" --notes-file notes.md
          fi

      - name: Report
        run: |
          set -euo pipefail

          npm_registry_version() {
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/$1/$2")
            [ "$status" = "200" ] && echo "$2" || echo "(not on registry)"
          }

          pypi_registry_version() {
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$1/$2/json")
            [ "$status" = "200" ] && echo "$2" || echo "(not on registry)"
          }

          {
            echo "## Release report: train ${{ steps.train.outputs.train }}"
            echo
            echo "| Package | Declared version | Result | Registry now has declared version |"
            echo "|---|---|---|---|"
            echo "| @redact-secret/adapter | ${ADAPTER_VERSION} | ${ADAPTER_RESULT} | $(npm_registry_version "@redact-secret/adapter" "$ADAPTER_VERSION") |"
            echo "| @redact-secret/adapter-pino | ${PINO_VERSION} | ${PINO_RESULT} | $(npm_registry_version "@redact-secret/adapter-pino" "$PINO_VERSION") |"
            echo "| @redact-secret/adapter-otel | ${OTEL_VERSION} | ${OTEL_RESULT} | $(npm_registry_version "@redact-secret/adapter-otel" "$OTEL_VERSION") |"
            echo "| redact-secret-adapters (PyPI) | ${PYTHON_VERSION} | ${PYTHON_RESULT} | $(pypi_registry_version "redact-secret-adapters" "$PYTHON_VERSION") |"
            echo
            echo "_\`skipped\` means the declared version was already published: not part of this train._"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail if any publish job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more publish jobs failed. See the release report above for exactly what shipped, then re-run this workflow on release to publish the rest."
          exit 1

  reconcile:
    name: Reconcile
    needs: finalize
    if: needs.finalize.result == 'success'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/release-reconcile.yml
    with:
      train: ${{ needs.finalize.outputs.train }}
