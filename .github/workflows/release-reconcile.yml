name: Release reconcile

# The last stage of a release train, after every planned package is
# published and tagged:
#
#   1. Verify: every declared version is on its registry, and every package
#      tag and the train tag exist. Anything else is a half-shipped train.
#   2. main: open release -> main, so main is exactly what has been published.
#
# Merging that PR moves main, which triggers sync-develop.yml: it opens
# sync/<train> -> develop from main, carrying back both the train and the
# merge commit main just gained. cut-rc.yml refuses the next train until
# that PR is merged, and it must be a merge commit, never a squash: develop
# has to contain main's commits, not a copy of them.
#
# The PRs are opened with GITHUB_TOKEN, which fires no pull_request event,
# so the required checks are dispatched onto their head refs directly.

on:
  workflow_call:
    inputs:
      train:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      train:
        description: "Train to reconcile, e.g. 2026.09.22"
        type: string
        required: true

permissions: {}

concurrency:
  group: release-reconcile
  cancel-in-progress: false

jobs:
  verify:
    name: Verify registries and tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Every declared version is published and tagged
        run: node scripts/release-plan.mjs --require-published --check-tags

      - name: The train tag exists
        env:
          TRAIN: ${{ inputs.train }}
        run: |
          set -euo pipefail
          if [ "$(git tag --list "train/$TRAIN")" != "train/$TRAIN" ]; then
            echo "::error::tag train/$TRAIN is missing"
            exit 1
          fi

  sync-main:
    name: Sync main
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TRAIN: ${{ inputs.train }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Open release -> main
        env:
          # A PR opened with GITHUB_TOKEN fires no `pull_request` event: GitHub
          # records the CI and Branch guard runs but refuses to execute them,
          # so they end as a startup failure with zero jobs and main's required
          # contexts stay `expected` forever. The runs dispatched below report
          # the same contexts and go green, but they land in another check
          # suite and don't satisfy the ruleset — which has no bypass actors,
          # so `--admin` can't force it either. Reopening the PR as a user
          # fires a real event and builds a check suite that counts.
          PR_BODY: |
            Brings main up to release after this train published. Merge with a merge commit.

            **If the merge is blocked by `N of N required status checks are expected`,**
            close and reopen this PR from your own account:

            ```
            gh pr close <n> && gh pr reopen <n>
            ```

            This PR was opened with `GITHUB_TOKEN`, which fires no `pull_request` event, so
            CI and Branch guard never ran in this PR's own check suite and the required
            contexts stay `expected`. The dispatched runs on the head ref go green but land
            in another check suite; main's ruleset has no bypass actors, so `--admin` won't
            force it. Reopening as a user fires a real event and the checks then count.
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/release origin/main; then
            echo "main already contains release"
            exit 0
          fi
          # main moves only by merge commits from release (the ruleset allows
          # nothing else), so after the first train main always holds a merge
          # commit release lacks. What must not exist is content: main's tree
          # has to equal the release commit it last merged.
          base="$(git merge-base origin/main origin/release)"
          if ! git diff --quiet "$base" origin/main; then
            echo "::error::main has changes release doesn't. main only ever moves by merging release; find how those changes got there."
            exit 1
          fi
          if [ -z "$(gh pr list --base main --head release --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head release \
              --title "Release train $TRAIN -> main" \
              --body "$PR_BODY"
          fi
          # Green on the head ref regardless of the ruleset — the rehearsal
          # signal an operator reads before merging.
          gh workflow run ci.yml --ref release
          gh workflow run branch-guard.yml --ref release -f base=main

  # The back-sync into develop is not here: it takes `main`, not `release`,
  # so that main stays an ancestor of develop, and main has not moved yet
  # while its PR is still open. `sync-develop.yml` runs it on push to main.
