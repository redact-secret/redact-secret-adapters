version: 2

# Dependabot opens PRs against the repository default branch (develop),
# which is where RELEASING.md says all changes land, so no target-branch is set.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Root package-lock.json covers the npm workspaces under packages/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Pinned npm CLI used by the release workflows (see .github/npm-tools).
  # Its bundled dependencies are scanned by Scorecard, so track new npm releases.
  - package-ecosystem: npm
    directory: /.github/npm-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  # The pinned bases of docker/bench*.Dockerfile, the overhead-harness images.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
