version: 2

# Dependabot opens PRs against the repository default branch (develop),
# which is where RELEASING.md says all changes land, so no target-branch is set.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # Root package-lock.json covers the npm workspaces under packages/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node tracks the lowest Node in `engines` (22.x), so type-checking
      # rejects APIs that Node lacks. Minor and patch updates within that major
      # are fine; move the major only when the engines floor moves (#72).
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # Pinned npm CLI used by the release workflows (see .github/npm-tools).
  # Its bundled dependencies are scanned by Scorecard, so track new npm releases.
  - package-ecosystem: npm
    directory: /.github/npm-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch

  # The pinned bases of docker/bench*.Dockerfile, the overhead-harness images.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The bench image must run a Node the packages support and CI tests
      # (engines and compatibility.json: 22.x, 24.x). Lift this when a
      # newer major joins the engines range and the CI matrix (#106).
      - dependency-name: node
        versions:
          - ">= 25"
